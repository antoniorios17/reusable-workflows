name: Create AWS Profiles
description: Create AWS deployment profile to assume roles inside Dev account and Prod account

inputs:
  target-account:
    description: 'Target account to create deployment profile for. Valid values are: Dev, prod'
    required: true
  role-to-assume:
    description: 'role to assume'
    default: 'DeploymentRole'


runs:
  using: "composite"

  steps:
    - name: Get current AWS cred
      uses: aws-actions/configure-aws-credentials@v5
      with:
        id-token: write
        role-skip-session-tagging: true
        role-to-assume: arn:aws:iam::434057724837:role/terraform
        max-attempts: 3

    - name: Setup Deploy AWS Profile
      shell: bash
      run: |
        aws configure set region ${{ env.AWS_REGION }} --profile Deploy
        aws configure set aws_access_key_id ${{ env.AWS_ACCESS_KEY_ID }} --profile Deploy
        aws configure set aws_secret_access_key ${{ env.AWS_SECRET_ACCESS_KEY }} --profile Deploy
        aws configure set aws_session_token ${{ env.AWS_SESSION_TOKEN }} --profile Deploy


