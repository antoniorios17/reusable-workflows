name: Create AWS Profiles
description: Create AWS deployment profile to assume roles inside Dev account and Prod account

inputs:
  target-account:
    description: 'Target account to create deployment profile for. Valid values are: dev, prod'
    required: true

runs:
  using: "composite"
  steps:
    - name: Get current AWS cred
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-region: us-east-1    # This is hardcoded because Deployer profile only in us-east-1
        unset-current-credentials: true
        role-skip-session-tagging: true
        role-to-assume: arn:aws:iam::434057724837:role/terraform
    - name: Test
      shell: bash
      run: |
        aws sts get-caller-identity

    - name: Setup Deployer AWS Profile
      shell: bash
      run: |
        aws configure set region ${{ env.AWS_REGION }} --profile Deployer
        aws configure set aws_access_key_id ${{ env.AWS_ACCESS_KEY_ID }} --profile Deployer
        aws configure set aws_secret_access_key ${{ env.AWS_SECRET_ACCESS_KEY }} --profile Deployer
        aws configure set aws_session_token ${{ env.AWS_SESSION_TOKEN }} --profile Deployer
    - name: test
      shell: bash
      run: |
        aws sts get-caller-identity --profile Deployer
    - name: test target account
      shell: bash
      run: echo "Target account is ${{ inputs.target-account }}"
