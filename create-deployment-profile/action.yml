name: Create AWS Profiles
description: Create AWS deployment profile to assume roles inside Dev account and Prod account

inputs:
  target-account:
    description: 'Target account to create deployment profile for. Valid values are: Dev, prod'
    required: true


runs:
  using: "composite"

  steps:
    - name: Get current AWS cred
      uses: aws-actions/configure-aws-credentials@v5
      with:
        id-token: write
        role-skip-session-tagging: true
        role-to-assume: arn:aws:iam::434057724837:role/terraform
        max-attempts: 3

    - name: Test
      shell: bash
      run: |
        echo "${{ inputs.target-account }}"
        aws sts get-caller-identity

