name: Create AWS Profiles
description: Create AWS deployment profile to assume roles inside Dev account and Prod account

inputs:
  target-account:
    description: 'Target account to create deployment profile for. Valid values are: dev, prod'
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        role-duration-seconds: 1200
    - name: test credentials
      shell: bash
      run: aws sts get-caller-identity


